# Flatpak manifest. Build/test:
#   flatpak install flathub org.kde.Platform//6.8 org.kde.Sdk//6.8 io.qt.PySide.BaseApp//6.8
#   flatpak-builder --user --install --force-clean build-dir packaging/io.github.shammer03.ProofMark.yml
app-id: io.github.shammer03.ProofMark
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.8'
command: proofmark
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network            # update check only; remove if you disable it in the Flatpak build
  - --filesystem=xdg-pictures  # scan folders; use the file portal for anything else
  - --filesystem=xdg-documents
modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation Pillow*.whl
    sources:
      - type: file
        # TODO: pin the real Pillow wheel URL + sha256 (use flatpak-pip-generator)
        url: https://files.pythonhosted.org/packages/REPLACE/Pillow.whl
        sha256: REPLACE
  - name: exiftool
    buildsystem: simple
    build-commands:
      - perl Makefile.PL && make install DESTDIR=/ PREFIX=/app
    sources:
      - type: archive
        # TODO: pin a current Image-ExifTool release + sha256
        url: https://exiftool.org/Image-ExifTool-REPLACE.tar.gz
        sha256: REPLACE
  - name: proofmark
    buildsystem: simple
    build-commands:
      - install -Dm644 proofmark.py /app/share/proofmark/proofmark.py
      - |
        cat > /app/bin/proofmark <<'WRAP'
        #!/bin/sh
        exec python3 /app/share/proofmark/proofmark.py "$@"
        WRAP
      - chmod +x /app/bin/proofmark
      - install -Dm644 packaging/io.github.shammer03.ProofMark.desktop /app/share/applications/io.github.shammer03.ProofMark.desktop
      - install -Dm644 packaging/io.github.shammer03.ProofMark.metainfo.xml /app/share/metainfo/io.github.shammer03.ProofMark.metainfo.xml
      - install -Dm644 packaging/proofmark-512.png /app/share/icons/hicolor/512x512/apps/io.github.shammer03.ProofMark.png
    sources:
      - type: dir
        path: ..
